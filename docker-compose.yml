services:
  bantracker:
    build: .
    container_name: bantracker
    restart: unless-stopped
    ports:
      - "3009:3000"
    environment:
      - PORT=3000
      - REMOTE_IP_URL=https://gpdev.com.ar/log/banned_ips.log
      - REMOTE_HISTORY_URL=https://gpdev.com.ar/log/ban_history.log
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bantracker-data:
    name: bantracker-data
